    <rect x="570" y="160" width="300" height="580" rx="150"/>
    <rect x="1020" y="280" width="300" height="340" rx="150"/>
    <path d="M420 450h150M870 450h150"/>
  </g>
  <g fill="#252b33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" text-anchor="middle">
    <text x="270" y="438">CONTENT</text>
    <text x="270" y="474">.md</text>
